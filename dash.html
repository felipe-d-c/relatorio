<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Léah Estética</title>
  <style>
    body { background: #121212; color: #fff; font-family: 'Work Sans', sans-serif; padding: 40px; }
    .card { background: #1E1E1E; border-radius: 14px; padding: 24px; border: 1px solid #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #333; }
    th { color: #ED2A78; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Relatórios Recebidos</h1>
    <table id="reportTable">
      <thead>
        <tr><th>Data</th><th>Unidade</th><th>Responsável</th><th>Tipo</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    // Substitua pela URL do seu Web App (a mesma que você já usa, mas que vamos configurar para leitura)
    const API_URL = "SUA_URL_DO_APPS_SCRIPT_AQUI/exec";

    async function loadReports() {
      const response = await fetch(API_URL);
      const data = await response.json();
      const tbody = document.querySelector("#reportTable tbody");
      data.forEach(row => {
        tbody.innerHTML += `<tr><td>${row.timestamp}</td><td>${row.unidade}</td><td>${row.responsavel}</td><td>${row.sheet}</td></tr>`;
      });
    }
    loadReports();
  </script>
</body>
</html>
